<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Florida Baseball Digest</title>
<style>
:root{--blue:#0021a5;--paper:#f7f6f2;--ink:#17212b;--muted:#617080;--line:#d8d4ca;--orange:#fa4616}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}.masthead{background:var(--blue);color:#fff;padding:30px max(24px,calc((100vw - 1460px)/2));border-bottom:5px solid var(--orange);display:flex;align-items:end;justify-content:space-between;gap:30px}.masthead-copy{min-width:0}.refresh-button{appearance:none;background:#fff;color:var(--blue);border:0;border-radius:3px;padding:13px 16px;text-decoration:none;cursor:pointer;font:700 12px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}h1{margin:0;font-size:clamp(2.1rem,5vw,4.4rem);letter-spacing:-.065em;line-height:.85;display:flex;align-items:center;gap:.22em}.gators-logo{width:clamp(72px,9vw,126px);height:auto;display:block;flex:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.22))}.heading-copy{display:block}.eyebrow{font:700 11px/1.2 Arial,sans-serif;letter-spacing:.18em;color:#f9d878;margin:0 0 11px;text-transform:uppercase}.sub{margin:13px 0 0;font:15px/1.4 Arial,sans-serif;color:#d7dff1}main{max-width:1460px;margin:auto;padding:30px 24px 60px}.status{font:12px Arial,sans-serif;color:var(--muted);padding-bottom:22px;border-bottom:1px solid var(--line)}.posts{padding-top:28px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.post{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);min-width:0;transition:transform .16s,box-shadow .16s}.post:hover{transform:translateY(-4px);box-shadow:0 9px 22px #18202b18}.image{width:100%;aspect-ratio:16/9;background:linear-gradient(130deg,#dfe6e6,#b8c3c8);overflow:hidden}.image img{width:100%;height:100%;object-fit:cover;display:block}.copy{padding:13px}.source{font:700 10px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{font:700 10px Arial,sans-serif;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}.title{font-size:17px;line-height:1.06;letter-spacing:-.025em;margin:9px 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.excerpt{font:12px/1.35 Arial,sans-serif;color:#5b6875;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.error{font:14px Arial,sans-serif;color:#9d2d29;background:#fff0ed;padding:12px}@media(max-width:1050px){.posts{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.masthead{padding-top:24px}.posts{grid-template-columns:repeat(2,1fr);gap:10px}.title{font-size:15px}.excerpt{display:none}main{padding:20px 14px 45px}}@media(prefers-reduced-motion:reduce){.post{transition:none}}
</style></head><body>
<header class="masthead"><div class="masthead-copy"><p class="eyebrow">10BLK Sports · University of Florida</p><h1><img class="gators-logo" src="gators-logo.png" alt="Florida Gators"><span class="heading-copy">Florida Baseball<br>Digest</span></h1><p class="sub">The 25 newest baseball stories across 13 official, local, national, and independent Gators sources.</p></div><a class="refresh-button" href="https://github.com/hsw10/UFBaseball/actions/workflows/refresh.yml" target="_blank" rel="noopener">↻ Refresh now</a></header>
<main><div class="status" id="status">Loading the latest dispatches…</div><div class="posts" id="digest"></div></main>
<script>
const digest=document.querySelector('#digest'),status=document.querySelector('#status');const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const date=s=>{try{return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(new Date(s))}catch{return s||''}};const fallback='gators-baseball-placeholder.svg';;async function load(){try{const r=await fetch(`data.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('No digest data yet');const d=await r.json();status.textContent=`${d.posts.length} newest stories across ${d.sources.length} sources · Last updated ${new Date(d.refreshedAt).toLocaleString()} · Refresh manually as needed`;digest.innerHTML=d.posts.map(p=>`<a class="post" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="image"><img src="${esc(p.image||fallback)}" alt="" loading="lazy" onerror="this.src='${fallback}'"></div><div class="copy"><div class="source">${esc(p.source)}</div><div class="date">${esc(date(p.published))}</div><h2 class="title">${esc(p.title)}</h2><p class="excerpt">${esc(p.excerpt)}</p></div></a>`).join('')}catch(e){status.textContent='Unable to load the digest.';digest.innerHTML=`<p class="error">${esc(e.message)}</p>`}}load();
</script></body></html>
