<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Florida Gators Baseball — 10BLK Sports</title>
  <desc id="desc">A Florida Gators baseball placeholder graphic branded by 10BLK Sports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a80"/>
      <stop offset="1" stop-color="#003dcc"/>
    </linearGradient>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="44" height="44" fill="none"/>
      <rect width="10" height="44" fill="#ffffff" opacity=".06"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#stripes)"/>
  <circle cx="400" cy="194" r="145" fill="#00145f" opacity=".56" stroke="#fa4616" stroke-width="8"/>
  <image href="gators-logo.png" x="285" y="78" width="230" height="230" preserveAspectRatio="xMidYMid meet"/>
  <rect x="0" y="335" width="800" height="115" fill="#fa4616"/>
  <text x="400" y="378" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="5">FLORIDA BASEBALL</text>
  <text x="400" y="421" text-anchor="middle" fill="#0021a5" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" letter-spacing="4">10BLK SPORTS</text>
</svg>
